<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Privacy Shield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <img src="../../icons/shield_mark.png" alt="" width="28" height="28">
        </span>
        <div class="brand-copy">
          <h2>ScreenShield</h2>
          <span id="siteHost" class="site-host">example.com</span>
        </div>
      </div>
      <div class="status-stack">
        <div id="statusPill" class="status-pill active">ACTIVE</div>
        <div id="sharingPill" class="sharing-pill hidden">
          <span class="rec-dot" aria-hidden="true"></span>SHARING TAB
        </div>
      </div>
    </header>

    <div class="stats-card">
      <div class="stat-number" id="blurredCount">0</div>
      <div class="stat-label">values redacted on this page</div>
      <div class="stat-total" id="totalProtected">—</div>
    </div>

    <div class="controls-list">
      <div class="control-row">
        <span class="control-label">
          <svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 2.8v5.4c0 4.4-3 8.1-7 9.8-4-1.7-7-5.4-7-9.8V5.8L12 3z"/></svg>
          Shield active
        </span>
        <label class="switch">
          <input type="checkbox" id="toggleShield" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="control-row">
        <span class="control-label">
          <svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M9 11h.01M15 11h.01M7 15h10"/></svg>
          Require <kbd class="kbd-inline">Alt</kbd> to reveal
        </span>
        <label class="switch">
          <input type="checkbox" id="toggleAltKey">
          <span class="slider"></span>
        </label>
      </div>

      <div class="control-row present-row">
        <span class="control-label">
          <svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="12" rx="2"/><path d="M8 21h8M12 17v4"/><rect x="6" y="8.5" width="5" height="2.2" rx="1" fill="currentColor" stroke="none"/><rect x="13" y="8.5" width="5" height="2.2" rx="1" fill="currentColor" stroke="none"/></svg>
          <span class="control-copy">Present Mode<small>opaque bars while sharing</small></span>
        </span>
        <label class="switch switch-danger">
          <input type="checkbox" id="togglePresent">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="shortcut-hint">
      <kbd>⌥⇧P</kbd> Present Mode
      <span class="hint-dot">·</span>
      <kbd>⌥⇧R</kbd> Rescan
      <span class="hint-dot">·</span>
      <kbd>⌥Click</kbd> Pin reveal
    </div>

    <div class="actions">
      <button id="rescanBtn" class="btn btn-secondary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        Re-scan page
      </button>
      <button id="openOptionsBtn" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></svg>
        Options &amp; audit log
      </button>
    </div>

    <div class="credit">made by <span class="credit-name">abhay_ethically</span></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
